name: DeskTwin checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: desktwin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-compile:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      MODEL_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # Compile against a real macOS SDK. Do not start detection on the CI host.
      - run: npm run hardware:build
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MODEL_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:production
